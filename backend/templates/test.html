<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Test - MoviesNemt</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #ff6b6b;
            --primary-dark: #ff5252;
            --secondary: #3a7bd5;
            --dark: #0f1419;
            --dark-light: #1a1f2e;
            --darker: #252b3d;
            --text: #e0e0e0;
            --text-light: #8a8f98;
        }

        body {
            background-color: var(--dark);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--darker);
            margin-bottom: 30px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i {
            color: var(--primary);
            font-size: 2rem;
        }

        h1 {
            color: var(--primary);
            font-size: 2rem;
        }

        .user-actions .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 24px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        /* Main Layout */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            min-height: 500px;
        }

        /* Chat Section */
        .chat-container {
            background: var(--dark-light);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .chat-messages {
            flex: 1;
            margin-bottom: 15px;
            overflow-y: auto;
            max-height: 300px;
        }

        .message {
            padding: 10px 15px;
            border-radius: 18px;
            margin-bottom: 10px;
            max-width: 80%;
        }

        .user-message {
            background: var(--secondary);
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            background: var(--darker);
            border-bottom-left-radius: 4px;
        }

        .chat-input {
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 24px;
            background: var(--darker);
            color: var(--text);
        }

        .chat-input button {
            padding: 12px 20px;
            border: none;
            border-radius: 24px;
            background: var(--primary);
            color: white;
            cursor: pointer;
        }

        /* Movies Section */
        .movies-container {
            background: var(--dark-light);
            border-radius: 12px;
            padding: 20px;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .movie-card {
            background: var(--darker);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            transition: transform 0.2s;
        }

        .movie-card:hover {
            transform: translateY(-2px);
        }

        .movie-poster {
            width: 100%;
            height: 200px;
            background: linear-gradient(45deg, #3a7bd5, #ff6b6b);
            border-radius: 4px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .movie-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .movie-year {
            color: var(--text-light);
            font-size: 0.9rem;
        }

        /* Test Status */
        .test-status {
            background: var(--primary);
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="test-status">
            <strong>✅ PROJECT FRONTEND TEST</strong> - Testing within your existing Flask structure
        </div>

        <header>
            <div class="logo">
                <i class="fas fa-film"></i>
                <h1>MoviesNemt AI</h1>
            </div>
            <div class="user-actions">
                <button class="btn btn-primary" onclick="showLogin()">Login</button>
            </div>
        </header>

        <div class="main-content">
            <!-- Chat Section -->
            <div class="chat-container">
                <h3>Chat with AI</h3>
                <div class="chat-messages" id="chatMessages">
                    <div class="message ai-message">
                        Hello! I'm your movie assistant. Ask me for recommendations!
                    </div>
                </div>
                <div class="chat-input">
                    <input type="text" id="userInput" placeholder="Type a message...">
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>

            <!-- Movies Section -->
            <div class="movies-container">
                <h3>Popular Movies</h3>
                <div class="movies-grid" id="moviesGrid">
                    <!-- Movies will be loaded here -->
                </div>
            </div>
        </div>

        <div style="margin-top: 30px; text-align: center;">
            <a href="/" style="color: var(--primary); text-decoration: none;">
                ← Back to Main App
            </a>
        </div>
    </div>

    <script>
        // Sample movie data
        const movies = [
            { title: "Inception", year: 2010, genres: ["Sci-Fi", "Action"] },
            { title: "The Dark Knight", year: 2008, genres: ["Action", "Drama"] },
            { title: "Interstellar", year: 2014, genres: ["Sci-Fi", "Adventure"] },
            { title: "Pulp Fiction", year: 1994, genres: ["Crime", "Drama"] },
            { title: "The Matrix", year: 1999, genres: ["Action", "Sci-Fi"] },
            { title: "Forrest Gump", year: 1994, genres: ["Drama", "Romance"] }
        ];

        // Initialize movies
        function loadMovies() {
            const moviesGrid = document.getElementById('moviesGrid');
            moviesGrid.innerHTML = movies.map(movie => `
                <div class="movie-card">
                    <div class="movie-poster">${movie.title}</div>
                    <div class="movie-title">${movie.title}</div>
                    <div class="movie-year">${movie.year}</div>
                </div>
            `).join('');
        }

        // Chat functionality
        function addMessage(text, isUser = false) {
            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'ai-message'}`;
            messageDiv.textContent = text;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            
            if (message) {
                addMessage(message, true);
                input.value = '';
                
                // Simulate AI response
                setTimeout(() => {
                    const responses = [
                        "I recommend checking out Inception or The Matrix for great sci-fi action!",
                        "Based on your taste, you might enjoy The Dark Knight or Pulp Fiction.",
                        "For drama films, Forrest Gump is a classic choice!",
                        "Interstellar has amazing visuals and storytelling if you like space themes."
                    ];
                    const randomResponse = responses[Math.floor(Math.random() * responses.length)];
                    addMessage(randomResponse);
                }, 1000);
            }
        }

        // Handle Enter key in chat
        document.getElementById('userInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Simple login demo
        function showLogin() {
            const username = prompt('Enter username (test only):');
            if (username) {
                alert(`Welcome ${username}! Frontend test successful.`);
                document.querySelector('.user-actions').innerHTML = `
                    <span style="color: var(--primary); margin-right: 10px;">Hello, ${username}</span>
                    <button class="btn btn-primary" onclick="logout()">Logout</button>
                `;
            }
        }

        function logout() {
            document.querySelector('.user-actions').innerHTML = `
                <button class="btn btn-primary" onclick="showLogin()">Login</button>
            `;
            alert('Logged out successfully!');
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', function() {
            loadMovies();
            addMessage("Frontend test loaded successfully within your project! Try the chat and login features.");
        });
    </script>
</body>
</html>
